<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // for문 - 반복횟수가 명확히 지정되어 있을 때 주로 사용
        // 1 ~ 10 까지 출력

        
        // for (초기화구문;조건식;증감식){
        // 반복문 안에 사용할 코드}
        // 초기화 구문은 1번만 실행, 조건식이 True면 반복문 안에 사용할 코드 실행, 증감식 실행. 
        // for문은 결국 조건식에서 끝나게 됨.
        for (let i = 1;i<=10 ;i++){
            document.write(i);
        }
        document.write("<br>");

        //실습문제 : 30의 약수를 전부 출력
        // 내 코드 왜 안나오지? 30/i는 몫이기 때문에 답이 안나옴;;
        for (let i=1;i<=30;i++){
            if (parseInt(30/i) == 0){
                document.write(i)
            }
        }
        //
        for (let i=1;i<=30;i++){
            if (parseInt(30%i) == 0){
                document.write(i," ")
            }
        }
    </script>
</body>
</html>
