<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <ul>
        <li>A</li>
        <li>B</li>
        <li>C</li>
    </ul>

    <script>
        //getElementById는 가장 위에 있는 첫번째 선택자만 가져옴.
        //태그 이름이 일치하는 모든 요소 가져오기
        //.getElementsByTagName는 해당 태그의 모든 요소를 객체 배열로 제공
        const li = document.getElementsByTagName('li');
        // console.log(li);

        // 문제 li태그의 모든 이름을 console log로 출력
        // 1. li태그가 배열이므로 인덱스로 접근
        // 2. 안의 "텍스트"를 출력해야하므로 innerText로 출력 (value)아님
        // console.log(li[0].innerText);
        // console.log(li[1].value);
        // console.log(li[2].value);
        // console.log(li.value);
        // console.log(li.value);

        for(i=0;i<li.length;i++){
            console.log(li[i].innerText);
        }
    </script>
</body>
</html>
