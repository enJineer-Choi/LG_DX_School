<body>
    <div id="wrap">
        <img id = "img" src="./images/img1.jpg" width="200px">
        <br>
        <button onclick="pre()">이전</button>
        <button onclick="next()">다음</button>
    </div>


    <script>
        // 문제. 다음버튼을 누르면 다음 이미지로 이전버튼을 누르면 이전 이미지로
        // 단, 맨첫장에서는 이전버튼 X, 맨 마지막 장에서는 다음버튼 X

        

        //리소스를 쉽게 관리하는 법
        // 이미지 주소저장 배열
        const source = [
            "./images/im1.jpg",
            "./images/im2.jpg",
            "./images/im3.jpg",
            "./images/im4.jpg",
            "./images/im5.jpg",
            "./images/im6.jpg",
            "./images/im7.jpg"
        ];
        let point = 0;
 
 
        const pre = () => {
            if(point > 0){
                // 다음 위치로 증가
                point--;
            }else{
                alert("이전 이미지가 없습니다.");
            }
            img.setAttribute("src", source[point]);
        }
 
        const next = () => {
            if(point < source.length - 1){
                // 다음 위치로 증가
                point++;
            }else{
                alert("다음 이미지가 없습니다.");
            }
            img.setAttribute("src", source[point]);
        }
