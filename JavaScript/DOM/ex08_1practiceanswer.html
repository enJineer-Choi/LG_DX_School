<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>입력한 값을 h1태그로 출력해보기</h1>
    <input type="text" id="input">
    <button onclick="inputH1()">h1태그 출력</button>
    <div id="result"></div>
 
    <script>
        const inputH1 = () => {
            const input = document.getElementById("input").value;
 
            document.getElementById("result").innerHTML = `<h1>${input}</h1>`;
        }
    </script>
 
</body>
</html>
