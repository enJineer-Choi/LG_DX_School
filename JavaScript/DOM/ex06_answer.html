<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>숫자 추측 게임</h1>
    <p>
        1부터 100까지의 숫자 중에서 하나의 숫자를 뽑았습니다.<br>
        당신이 추측할 수 있는 기회는 10번 입니다. <br>
        추측한 숫자가 높다거나 낮다는 알림을 드리겠습니다. <br>
    </p>
    <input type="text" id="inputNum">
    <button onclick="answer()">추측</button>
 
    <p id="last">이전 결과 : </p>
    <p id="result"></p>
 
    <script>
        // 최종화면을 보여줄 요소 가져오기
        const result = document.getElementById("result");
 
        // 랜덤 숫자 뽑기 1~100
        const random = Math.floor(Math.random() * 100) + 1;
        console.log(random);
 
        let text = "이전 결과 : ";
 
        let life = 10; // 목숨
 
        const answer = () => {
            // input태그에 입력한 숫자 가져오기
            const input = document.getElementById("inputNum");
            const num = parseInt(input.value);
            // 입력한 숫자 나열되면서 보여주기
            const last = document.getElementById("last");
            text = text + num + " ";
            last.innerText = text;
 
            // 정답체크하기
            if(random == num){ // 정답
                alert("정답 입니다!");
                result.innerHTML = "<span style='display:block; background-color:green; width : 100%; color : white;'>정답입니다!</span>";
            }else if(random < num){ // 정답보다 숫자가 높을 때
                alert("작은 수를 입력하시오!");
                result.innerHTML = "<span style='display:block; background-color:red; width : 100%; color : white;'>작은 수를 입력하시오!</span>";
                life--;
            }else if(random > num){ // 정답보다 숫자가 낮을 때
                alert("큰 수를 입력하시오!");
                result.innerHTML = "<span style='display:block; background-color:red; width : 100%; color : white;'>큰 수를 입력하시오!</span>";
                life--;
            }
 
            // 목숨체크하기
            if(life == 0){
                result.innerHTML = "<span style='display:block; background-color:red; width : 100%; color : white;'>도전 실패..</span>";
            }
 
 
 
 
        }
 
 
    </script>
</body>
</html>
