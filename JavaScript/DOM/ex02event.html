<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 요소에 이벤트 작동 시 감지하기 위한 리스너는 on이벤트명을 통해 달아-->
    <button onclick="alert('Hello()!')">여기를 눌러주세요!</button>
    <button onclick={}=>alert("안녕하세요!")>여기도 눌러주세요!</button>
    <script>
        //event는 event listener와 함께 사용;
        function Hello()
        {
            alert('한녕하세요!');
        }

        //표혀방식
        // const hello = function(){alert("안녕하세요")}

        //화살표
        //cost hello = () =>{alert("안녕하세요!")}

    </script>
</body>
</html>
