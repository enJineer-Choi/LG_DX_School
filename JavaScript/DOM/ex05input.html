<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="text">
    <button onclick ="result()">입력!</button>

    <script>
        //input 태그 안에 작성 한 값 가져오기
        let result = () => {
            const input = document.getElementById("text");
            alert(input.value);
            //innerText 또는 innerHTML을 사용할 수 있는 요소는 쌍으로 이루어진 요소이다. >
            // 즉 태그들 사이의 값을 가져오는 거임
            // input태그의 값을 가져올 때는 value
        }
    </script>
</body>
</html>
