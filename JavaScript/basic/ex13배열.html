<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //배열 : 데이터가 순차적으로 나열된 것
        //배열 생성방법

        //길이가 0인 배열생성
        const name1 = new Array();
        const name2 = [];

        //길이가 10인 배열 생성
        const name3 = new Array(10);
        //길이와 동시에 값을 처음부터 넣고 싶을때
        const name4 = new Array("A","B","C","D");
        const name5 = ["A","B","C","D"];

        //배열에서 값 꺼내기
        document.write(name5[1]);
        document.write("<br>")
        
        //배열의 길이 알아내기 > length는 속성값이라 ()를 사용하지 않음.
        document.write(name5.length);
        document.write("<br>")
        
        //배열의 값 추가하기(맨 뒤에) - push()
        name5.push('E');
        document.write(name5);
        document.write("<br>")

        //배열의 값 추가하기(맨 앞에) - unshift()
        name5.unshift('Z');
        document.write(name5)
        document.write("<br>")

        //삭제하기 (맨 뒤의 값) - pop()
        name5.pop();
        document.write(name5);
        document.write("<br>");

        //삭제하기 (맨 앞의 값) - shift()
        name5.shift();
        document.write(name5);
        document.write("<br>");


    </script>
</body>
</html>
