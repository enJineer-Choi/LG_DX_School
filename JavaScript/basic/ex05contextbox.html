<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //대화상자 - Web browser에서 사용하는 팝업창 >> 확인을 누르기 전까지는 화면이 나오지 않음.

        // 경고창 - 문구를 사용자에게 안내하기 위한 팝업창
        alert('그래도 하시겠습니까?');

        // confirm - 사용자에게 확인 또는 취소를 입력받을 수 있음
        // 확인과 취소를 값으로 받아올 수 있음. > boolean으로
        const result1 = confirm("오늘은 저녁을 드시겠습니까?");
        console.log("결과 : ",result1);

        //
        const result2 = prompt("좋아하는 가수 이름을 입력해주세요");
        console.log("좋아하는 가수 : " ,result2);
    </script>
</body>
</html>
