<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--HTML에서 Javascript를 사용하는 방법 <script> 태그를 통해 작성-->
    <script>
        // Javascript 주석 (한줄)
        /*
            Javascript 주석 (여러줄)
        */
        //Hello world! 출력하기 (콘솔창 출력)
        console.log("Hello World!");

        //Hello world! 웹페이지 안에 쓰기
        // documnet 내장 객체를 통해서 write 함수를 사용함.
        //document.write 함수안에 태그가 있으면 태그형태로 적용됨
        document.write("Hello World!");
        document.write("<h1>Hello Javascript</h1>");

        // 다양한 console 출력 형태
        console.log("출력!");
        console.info("출력!");
        console.warn("출력!");
        console.error("출력!");

    </script>
</body>
</html>
